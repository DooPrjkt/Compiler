name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
            bc rsync lz4 cpio libssl-dev repo

      - name: Sync minimal manifest
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          git config --global user.name "mibomboq"
          git config --global user.email "mibomboq@users.noreply.github.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Clone device tree
        run: |
          cd ~/twrp
          git clone https://github.com/mibomboq/android_device_advan_X1 -b <branch> device/advan/X1

      - name: Build
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_X1-eng
          mka vendorbootimage -j$(nproc)   # ganti ke bootimage / recoveryimage sesuai setup

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: twrp-X1
          path: ~/twrp/out/target/product/X1/*.img
