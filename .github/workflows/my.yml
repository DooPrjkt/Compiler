name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo kernel (user/repo)"
        default: "DooPrjkt/android_kernel_common"
      branch:
        description: "Branch"
        default: "android12-5.10-lts"
      defconfig:
        description: "Defconfig"
        default: "gki_defconfig"
      clang:
        description: "Versi clang"
        type: choice
        default: "14"
        options:
          - "12"
          - "13"
          - "14"
          - "15"
          - "16"
          - "17"
          - "18"
          - "19"
      lto:
        description: "Mode LTO"
        type: choice
        default: "thin"
        options:
          - "thin"
          - "full"
          - "none"
          - "default"
      tcp_cong:
        description: "TCP congestion (bbrplus = set 3 config BBRPlus)"
        type: choice
        default: "not"
        options:
          - "not"
          - "bbrplus"

env:
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Siapin helper Telegram
        run: |
          cat > $HOME/tg.sh <<'EOF'
          #!/bin/bash
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT_ID" -d parse_mode=HTML \
            --data-urlencode text="$1" > /dev/null
          EOF
          chmod +x $HOME/tg.sh
          $HOME/tg.sh "🚀 <b>Build kernel #${{ github.run_number }} mulai</b>
          Repo: ${{ inputs.repo }}
          Branch: ${{ inputs.branch }}
          Defconfig: ${{ inputs.defconfig }}
          Clang: ${{ inputs.clang }}
          LTO: ${{ inputs.lto }}
          TCP: ${{ inputs.tcp_cong }}"

      - name: Tambah swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev libelf-dev lz4 cpio python3 wget lsb-release \
            software-properties-common gnupg zip

          V=${{ inputs.clang }}
          if [ "$V" -le 15 ]; then
            sudo apt-get install -y clang-$V lld-$V llvm-$V
          else
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh $V
            sudo apt-get install -y lld-$V llvm-$V
          fi
          /usr/lib/llvm-$V/bin/clang --version | head -1
          $HOME/tg.sh "📦 Dependency selesai (clang $V)"

      - name: Clone kernel
        run: |
          git clone --depth=1 -b ${{ inputs.branch }} \
            https://github.com/${{ inputs.repo }}.git kernel
          $HOME/tg.sh "📥 Clone repo selesai"

      - name: Build
        working-directory: kernel
        run: |
          export PATH=/usr/lib/llvm-${{ inputs.clang }}/bin:$PATH
          export ARGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS=-Wno-error"

          make $ARGS ${{ inputs.defconfig }}

          # mode LTO
          case "${{ inputs.lto }}" in
            thin)
              ./scripts/config --file out/.config -d LTO_CLANG_FULL -e LTO_CLANG_THIN
              make $ARGS olddefconfig ;;
            full)
              ./scripts/config --file out/.config -d LTO_CLANG_THIN -e LTO_CLANG_FULL
              make $ARGS olddefconfig ;;
            none)
              ./scripts/config --file out/.config \
                -d LTO_CLANG_FULL -d LTO_CLANG_THIN -d LTO_CLANG -d CFI_CLANG -e LTO_NONE
              make $ARGS olddefconfig ;;
            *) echo "LTO: ikut defconfig" ;;
          esac

          # TCP congestion
          case "${{ inputs.tcp_cong }}" in
            bbrplus)
              ./scripts/config --file out/.config \
                -e TCP_CONG_ADVANCED \
                -e TCP_CONG_BBRPLUS \
                -d DEFAULT_CUBIC -d DEFAULT_BBR -d DEFAULT_RENO \
                -e DEFAULT_BBRPLUS \
                --set-str DEFAULT_TCP_CONG bbrplus
              make $ARGS olddefconfig
              grep -E "BBRPLUS|DEFAULT_TCP_CONG" out/.config
              if ! grep -q "^CONFIG_TCP_CONG_BBRPLUS=y" out/.config; then
                $HOME/tg.sh "⚠️ BBRPlus ga ke-set (Kconfig-nya ga ada di source), lanjut tanpa BBRPlus"
              fi ;;
            *) echo "TCP congestion: ikut defconfig" ;;
          esac

          grep -E "CONFIG_LTO|CONFIG_CFI|BBRPLUS|DEFAULT_TCP_CONG" out/.config

          $HOME/tg.sh "⚙️ Config selesai (LTO: ${{ inputs.lto }}, TCP: ${{ inputs.tcp_cong }}), mulai compile..."

          # notif periodik tiap 5 menit
          ( while true; do
              sleep 300
              N=$(find out -name '*.o' 2>/dev/null | wc -l)
              $HOME/tg.sh "🔨 Masih building... ($N object file selesai)"
            done ) &
          TICKER=$!

          START=$(date +%s)
          make $ARGS -j$(nproc) Image.gz 2>&1 | tee ../build.log
          RC=${PIPESTATUS[0]}
          kill $TICKER 2>/dev/null

          END=$(date +%s)
          echo "DUR=$(( (END-START)/60 ))" >> $GITHUB_ENV
          echo "KVER=$(make $ARGS -s kernelversion)" >> $GITHUB_ENV
          exit $RC

      - name: Bungkus AnyKernel3
        run: |
          git clone --depth=1 https://github.com/DooPrjkt/AnyKernel3_2.git ak3
          cp kernel/out/arch/arm64/boot/Image.gz ak3/Image.gz
          cd ak3
          ZIPNAME="Kernel-${KVER}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 ../$ZIPNAME . -x ".git*" "README.md" "*placeholder"
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
          $HOME/tg.sh "📦 Zip AnyKernel3 selesai: $ZIPNAME"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.run_number }}
          path: |
            *.zip
            build.log

      - name: Kirim hasil ke Telegram
        if: success()
        run: |
          curl -s -F chat_id=$TG_CHAT_ID \
            -F document=@$ZIPNAME \
            -F parse_mode=HTML \
            -F caption="✅ <b>Build #${{ github.run_number }} sukses</b>
          Versi: $KVER
          Branch: ${{ inputs.branch }}
          Clang: ${{ inputs.clang }}
          LTO: ${{ inputs.lto }}
          TCP: ${{ inputs.tcp_cong }}
          Durasi: $DUR menit" \
            https://api.telegram.org/bot$TG_TOKEN/sendDocument

      - name: Kirim log kalau gagal
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f build.log ]; then
            curl -s -F chat_id=$TG_CHAT_ID \
              -F document=@build.log \
              -F caption="❌ Build #${{ github.run_number }} GAGAL
          $RUN_URL" \
              https://api.telegram.org/bot$TG_TOKEN/sendDocument
          else
            $HOME/tg.sh "❌ Build #${{ github.run_number }} GAGAL sebelum compile
          $RUN_URL"
          fi
